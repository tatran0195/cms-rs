[package]
name = "cms-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "cms-server"
path = "main.rs"

[dependencies]
cms-api = { path = "../crates/cms-api" }
cms-sites = { path = "../crates/cms-sites" }
cms-middleware = { path = "../crates/cms-middleware" }
cms-config = { path = "../crates/cms-config" }
cms-error = { path = "../crates/cms-error" }
cms-queue = { path = "../crates/cms-queue" }
cms-worker = { path = "../crates/cms-worker", optional = true }

# HTTP
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
hyper = { workspace = true }

# Async
tokio = { workspace = true, features = ["full"] }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Configuration
config = { workspace = true }

[features]
default = []
worker = ["dep:cms-worker"]

[lints]
workspace = true

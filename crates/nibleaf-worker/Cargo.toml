[package]
name = "nibleaf-worker"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "nibleaf-worker"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true, features = ["full"] }
nibleaf-biz = { path = "../nibleaf-biz" }
nibleaf-db = { path = "../nibleaf-db" }
nibleaf-queue = { path = "../nibleaf-queue" }
nibleaf-storage = { path = "../nibleaf-storage" }
nibleaf-search = { path = "../nibleaf-search" }
nibleaf-config = { path = "../nibleaf-config" }
nibleaf-error = { path = "../nibleaf-error" }
nibleaf-analytics = { path = "../nibleaf-analytics" }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }

[features]
default = []
redis = []

[lints]
workspace = true

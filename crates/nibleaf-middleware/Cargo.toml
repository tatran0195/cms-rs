[package]
name = "nibleaf-middleware"
version = "0.1.0"
edition = "2021"
description = "Cross-cutting Tower layers for Nibleaf"

[dependencies]
# Internal crates
nibleaf-error = { path = "../nibleaf-error" }
nibleaf-config = { path = "../nibleaf-config" }
nibleaf-entity = { path = "../nibleaf-entity" }
nibleaf-biz = { path = "../nibleaf-biz" }
nibleaf-db = { path = "../nibleaf-db" }
nibleaf-storage = { path = "../nibleaf-storage" }
nibleaf-queue = { path = "../nibleaf-queue" }
nibleaf-search = { path = "../nibleaf-search" }
nibleaf-access-control = { path = "../nibleaf-access-control" }

# External dependencies
axum = { workspace = true }
tower = { workspace = true }
tower-http = { version = "0.7.0", features = ["cors", "limit", "trace", "compression-full", "fs", "sensitive-headers", "set-header"] }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
lazy_static = { workspace = true }
parking_lot = { workspace = true }
async-trait = { workspace = true }

# Production-ready infrastructure crates
governor = { workspace = true }  # Rate limiting with per-key support
metrics = { workspace = true }  # Lightweight metrics collection
metrics-exporter-prometheus = { version = "0.11", optional = true }  # Optional Prometheus exporter
hyper = { version = "1.3", optional = true }  # For Prometheus exporter

[features]
default = []
prometheus = ["metrics-exporter-prometheus", "hyper"]

[lints]
workspace = true

[package]
name = "cms-search"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = { workspace = true }
cms-config = { path = "../cms-config" }
cms-error = { path = "../cms-error" }
cms-entity = { path = "../cms-entity" }
cms-db = { path = "../cms-db" }

# Japanese tokenizer
lindera = { version = "0.25" }

# Vector search
pgvector = { version = "0.4", optional = true }

# Postgres
sqlx = { workspace = true, features = ["postgres", "runtime-tokio"] }

# Qdrant
qdrant-client = { version = "0.11", optional = true }

# Async
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

[features]
default = ["pgvector"]
pgvector = ["dep:pgvector"]
qdrant = ["dep:qdrant-client"]

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true

[package]
name = "nibleaf-search"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = { workspace = true }
nibleaf-config = { path = "../nibleaf-config" }
nibleaf-error = { path = "../nibleaf-error" }
nibleaf-entity = { path = "../nibleaf-entity" }
nibleaf-db = { path = "../nibleaf-db" }

# Japanese tokenizer
lindera = { version = "0.25" }

# Vector search
pgvector = { version = "0.4", optional = true }

# Postgres
sqlx = { workspace = true, features = ["postgres", "runtime-tokio"] }

# Async
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

[features]
default = ["pgvector"]
pgvector = ["dep:pgvector"]
qdrant = []

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true

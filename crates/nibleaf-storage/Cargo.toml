[package]
name = "nibleaf-storage"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
nibleaf-config = { path = "../nibleaf-config" }
nibleaf-error = { path = "../nibleaf-error" }

# S3 support (optional)
aws-sdk-s3 = { version = "1", features = ["rt-tokio"], optional = true }
aws-config = { version = "1", optional = true }

[features]
default = []
s3 = ["aws-sdk-s3", "aws-config"]

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tempfile = "3"

[lints]
workspace = true

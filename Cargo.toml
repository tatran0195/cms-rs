[workspace]
# Nibleaf Rust Workspace
#
# This workspace contains the Rust backend for Nibleaf, a modern documentation platform.
#
# Architecture:
# - nibleaf-*: Library crates (entity, db, biz, api, middleware, etc.)
# - nibleaf-server: Binary crate (composition root)
#
# Layering (AppFlowy-inspired):
#   API Layer (nibleaf-api) → Biz Layer (nibleaf-biz) → DB Layer (nibleaf-db)
#   No circular dependencies allowed
#
# Deployment:
# - Single AWS Windows machine (no Docker)
# - In-process auth (no GoTrue)
# - Pluggable backends: local-disk/S3, pgvector/Qdrant, memory/Redis, Postgres/ClickHouse

members = [
    "crates/nibleaf-config",
    "crates/nibleaf-error",
    "crates/nibleaf-entity",
    "crates/nibleaf-db",
    "crates/nibleaf-auth",
    "crates/nibleaf-access-control",
    "crates/nibleaf-storage",
    "crates/nibleaf-search",
    "crates/nibleaf-queue",
    "crates/nibleaf-analytics",
    "crates/nibleaf-mcp",
    "crates/nibleaf-biz",
    "crates/nibleaf-sites",
    "crates/nibleaf-api",
    "crates/nibleaf-worker",
    "crates/nibleaf-middleware",
    "src",
]
resolver = "2"

[workspace.dependencies]
# Internal dependencies (path-based)
nibleaf-config = { path = "crates/nibleaf-config" }
nibleaf-error = { path = "crates/nibleaf-error" }
nibleaf-entity = { path = "crates/nibleaf-entity" }
nibleaf-db = { path = "crates/nibleaf-db" }
nibleaf-auth = { path = "crates/nibleaf-auth" }
nibleaf-access-control = { path = "crates/nibleaf-access-control" }
nibleaf-storage = { path = "crates/nibleaf-storage" }
nibleaf-search = { path = "crates/nibleaf-search" }
nibleaf-queue = { path = "crates/nibleaf-queue" }
nibleaf-analytics = { path = "crates/nibleaf-analytics" }
nibleaf-mcp = { path = "crates/nibleaf-mcp" }
nibleaf-biz = { path = "crates/nibleaf-biz" }
nibleaf-sites = { path = "crates/nibleaf-sites" }
nibleaf-api = { path = "crates/nibleaf-api" }
nibleaf-worker = { path = "crates/nibleaf-worker" }
nibleaf-middleware = { path = "crates/nibleaf-middleware" }

# External dependencies (versioned)
# HTTP & Web
axum = "0.7.7"
tower = "0.4.13"
tower-http = { version = "0.7.0", features = ["cors", "limit", "trace", "compression-full", "fs", "sensitive-headers"] }
tokio = { version = "1.38", features = ["full"] }
hyper = "1.3"
axum-extra = { version = "0.9.3", features = ["typed-header", "cookie"] }

# Serialization
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"

# Database
sqlx = { version = "0.7.4", features = ["postgres", "chrono", "uuid", "json"] }

# Time & UUID
chrono = { version = "0.4.38", features = ["serde"] }
uuid = { version = "1.7", features = ["v4", "serde"] }

# Logging & Tracing
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "fmt", "json"] }

# Configuration
config = "0.14"

# Error handling
anyhow = "1.0.86"
thiserror = "1.0.61"
async-trait = "0.1.80"

# Utilities
bytes = "1.6"
pulldown-cmark = "0.13"
ammonia = "3.3"
validator = { version = "0.16", features = ["derive"] }
utoipa = { version = "4.2.3", features = ["axum_extras", "chrono", "uuid", "yaml"] }
schemars = "0.8.21"
parking_lot = "0.12.3"
lazy_static = "1.4"
mockall = "0.13"

# Authentication
jsonwebtoken = "9.3"
argon2 = { version = "0.5.3", features = ["std"] }
base64 = "0.22"
serde_urlencoded = "0.7"

# Production-ready infrastructure
governor = "0.6.3"
metrics = "0.23"
metrics-exporter-prometheus = "0.11"

# Optional dependencies (for features) - these cannot be in workspace.dependencies
# They must be specified in individual crate Cargo.toml files with optional = true
redis = { version = "0.25", features = ["tokio-comp"] }
deadpool-redis = { version = "0.15" }
apalis = { version = "0.4", features = ["memory", "redis"] }
aws-sdk-s3 = { version = "1", features = ["rt-tokio"] }
aws-config = { version = "1" }
pgvector = { version = "0.4" }
lindera = "0.25"

[workspace.metadata]
# Configuration for cargo tools
# This workspace follows AppFlowy's layering discipline
# All dependencies flow downward: api → biz → db
# No circular dependencies allowed

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false

[workspace.lints.rust]
unused = "allow"
dead_code = "allow"
ambiguous_glob_reexports = "allow"
